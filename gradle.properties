# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric — same verified toolchain as the sibling attack-of-the-bteam repo
# (26.2 is the version whose Vulkan backend this whole mod exists for; the
# merged jar is unobfuscated, so there is no mappings line anywhere).
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT
fabric_api_version=0.155.2+26.2

# Project
mod_version=1.6.0
maven_group=com.deds

# --- NeoForge ---------------------------------------------------------
# 26.2 left beta at .57; .75 is the current release. The 26.2.0.6-beta in
# this machine's cache is 69 versions stale and belongs to a sibling
# project's template, not to us.
neoforge_version=26.2.0.75
moddev_version=2.0.146

# Sodium, compiled against for the interop adapter and never shipped.
# Modrinth maven coordinates are <slug>:<version_number>, and the version
# number carries the loader, so the Fabric and NeoForge builds need
# different ones. Pinned exactly: this is a beta whose internals are not a
# stable API, and the adapter mixes into those internals.
sodium_version=mc26.2-0.9.2-beta.1-fabric
# The NeoForge build needs the loader-suffixed twin of the same version:
# Modrinth has published the two loaders a day apart before, so it is a
# second property rather than a string replace of the first.
sodium_neoforge_version=mc26.2-0.9.2-beta.1-neoforge
