# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# --- THE MINECRAFT TARGET -----------------------------------------------
# One source tree builds several Minecraft versions; versions/README.md is
# the manual. `mc` is the target a plain ./gradlew builds, and `-Pmc=26.2`
# on the command line overrides it. `mc_canonical` is the version the
# shared sources are WRITTEN for (the IDE's version); every other target is
# derived from it through versions/mc<target>/renames.txt and the overlay
# under versions/mc<target>/. The per-version toolchain (Minecraft, loader,
# Fabric API, NeoForge, Sodium) lives in versions/mc<target>.properties,
# and nowhere else.
mc=26.3
mc_canonical=26.3

# Version-independent tooling. Loom 1.17 merges both 26.2 and 26.3;
# ModDevGradle 2.0.147 is the first that can build NeoForge 26.3 (2.0.146's
# NeoForm runtime fails recompiling it) and it builds 26.2 as before.
loom_version=1.17-SNAPSHOT
moddev_version=2.0.147

# Project. The full version string is "<mod_version>+mc<target>", e.g.
# 1.6.1+mc26.3 - the same shape Sodium uses, so the jar says which game it
# is for. Players see it in the mod list and Modrinth lists one file per
# game version under one mod version.
mod_version=1.6.1
maven_group=com.deds
