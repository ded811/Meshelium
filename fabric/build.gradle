// The Fabric package of Meshelium.
//
// This is the pre-split build, moved here UNCHANGED apart from the source
// sets below. It is the toolchain that has gated every change this project
// has made, so it was moved rather than rewritten - see the root
// build.gradle for why the split does not use Architectury.
//
// The project holds two source files of its own, the entrypoint and its
// MesheliumPlatform.Services implementation, plus the gametest suite, which
// uses Fabric's client gametest API and so cannot be shared. The renderer
// itself comes from ../common.

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'java-library'
}

// 1.6.1+mc26.3: the mod version and the Minecraft it is for, derived by the
// root build from gradle.properties and versions/mc<target>.properties.
version = project.mod_version_full
group = project.maven_group

// THE SHARED RENDERER. common/ is plain source, not a Gradle project: this
// project compiles it as if it were its own, and the NeoForge project does
// the same. Nothing in there names a loader, so both compilations see an
// identical and complete picture.
//
// Resources come with it for the same reason - the mixin config and the ten
// shader files belong beside the code that uses them.
//
// Every root goes through rootProject.versionedRoot (2026-09-20): for the
// canonical Minecraft version that returns the directory itself, and for
// a derived target (-Pmc=26.2) it returns the copy under build/versioned/
// that the rename table and the versions/mc<target>/ overlay produce. This
// project's own src/main is included the same way rather than left as
// Gradle's default, because the entrypoint imports moved classes too. See
// versions/README.md.
sourceSets {
	main {
		java.srcDirs = [
				rootProject.ext.versionedRoot(project, 'fabric/src/main/java'),
				rootProject.ext.versionedRoot(project, 'common/src/main/java'),
				// The Sodium adapter. Its own tree rather than part of
				// common/, because common/ must compile with nothing but
				// vanilla on the classpath and this names Sodium types in
				// every file. Both loaders add it and both supply their own
				// Sodium coordinate, so the adapter exists on Fabric and
				// NeoForge alike.
				rootProject.ext.versionedRoot(project, 'sodium/src/main/java'),
		].flatten()
		resources.srcDirs = [
				rootProject.ext.versionedRoot(project, 'fabric/src/main/resources'),
				rootProject.ext.versionedRoot(project, 'common/src/main/resources'),
				rootProject.ext.versionedRoot(project, 'sodium/src/main/resources'),
		].flatten()
	}
}

base {
	// "meshelium", not "meshelium-fabric": this is the jar players have
	// installed since 1.0.0 and the name is on Modrinth.
	archivesName = 'meshelium'
}

// Loom supplies the Fabric and Maven Central repositories implicitly; this
// adds the one it does not. Scoped with includeGroup so every other
// dependency in this build keeps resolving exactly where it did before -
// an unscoped extra repository changes resolution order for everything.
repositories {
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content { includeGroup 'maven.modrinth' }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// 26.2 is unobfuscated — no mappings line, same as the sibling repo.

	// No optional-mod dependencies, deliberately. The ModMenu adapter that
	// used to live here was the ONLY thing stopping a clean clone from
	// building: it compiled against a jar at ../test-mods on one machine.
	// Settings reach players through vanilla's own Video Settings screen
	// (VideoSettingsScreenMixin) and the /meshelium command, so the adapter
	// was a third route to a screen that already had two.

	// Sodium, to COMPILE the interop adapter against. compileOnly: the
	// adapter classes ship in our jar, Sodium itself never does, and at
	// runtime the gate decides whether any of it is reachable.
	//
	// From the Modrinth maven rather than ../test-mods on purpose. A shipped
	// code path cannot depend on a jar that happens to be sitting beside the
	// repo on one machine - that is exactly what stopped a clean clone
	// building before 1.0.0, and the note above this block is the scar.
	// The NeoForge project does the same with the loader-suffixed twin
	// (sodium_neoforge_version), unwrapped from its jar-in-jar shell.
	compileOnly "maven.modrinth:sodium:${project.sodium_version}"

	// -Pmeshelium.sodium puts Sodium on the RUN classpath for the interop
	// work: the gametest harness is the only way to get a world rendering
	// on this loader, and its run directory is wiped before every run, so
	// dropping a jar in there by hand does not survive.
	//
	// Property-gated and runtime-only on purpose. That is the difference
	// between this and the ModMenu adapter above: nothing COMPILES against
	// it, and without the property the dependency does not exist at all.
	//
	// The run jar is the same Modrinth artefact compileOnly resolves above
	// (since 2026-09-14; it used to be a file path under ../test-mods with
	// a configuration-time throw when the file was missing). Same bytes:
	// the cached Modrinth jar and the ../test-mods copy were 1,885,574
	// bytes, MD5 1c808d739819e94e2e02a83c0d97128e, both. The throw had to
	// go because -Pmeshelium.sodium is a root-level property and Gradle
	// configures EVERY project for a `:neoforge:runClient` invocation, so
	// the NeoForge proof run tripped it on any clone without the sibling
	// folder. If a file path is ever wanted again, keep `files(path)`
	// (legal for a missing file at configuration) and move the existence
	// check into gradle.taskGraph.whenReady, gated on a :fabric run task
	// actually being scheduled.
	if (project.hasProperty('meshelium.sodium')) {
		runtimeOnly "maven.modrinth:sodium:${project.sodium_version}"
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'meshelium_test'
		// NO server gametests: this mod is environment "client" — a
		// dedicated server never loads a line of it, so a server gametest
		// run could only ever vacuously pass. Client gametests are the
		// entire test story, which is honest for a renderer.
		enableGameTests = false
		// Layer 3 from wave 0 (the lesson the pack repo paid for three
		// playtest rounds too late): a renderer mod's only honest test is a
		// real client with a real GPU. `runClientGameTest` is the task; on
		// this machine that GPU is an RX 9070 XT (RDNA4), which is also the
		// mod's primary target hardware.
		enableClientGameTests = true
		eula = true
	}
}

// The gametest source set configureTests created above, pointed at the
// versioned copy of its root for the same reason main is (a derived
// target's tests must see that target's class names). For the canonical
// version this is exactly the default src/gametest.
sourceSets {
	gametest {
		java.srcDirs = [rootProject.ext.versionedRoot(project, 'fabric/src/gametest/java')].flatten()
		resources.srcDirs = [rootProject.ext.versionedRoot(project, 'fabric/src/gametest/resources')].flatten()
	}
}

// The stand-down suite's SodiumPageProbe names Sodium's config model and
// screen classes (1.6.2). Compile-only, so the ordinary suite's run
// classpath is unchanged and the probe class is simply never loaded there;
// declared here because the gametest source set, and with it this
// configuration, only exists once configureTests above has run.
dependencies {
	gametestCompileOnly "maven.modrinth:sodium:${project.sodium_version}"
}

// Wave-1 harness support: `-Pmeshelium.backend=opengl|vulkan|default` pins the
// client gametest onto one GPU backend and tells the test which path to
// assert. Two facts verified against the real jars (docs/VANILLA-VULKAN-SEAM.md):
//  - vanilla's Main accepts `--graphicsBackend <value>` where <value> matches
//    a PreferredGraphicsApi enum name case-insensitively (joptsimple
//    EnumConverter, bytecode-checked in both cached jopt versions), and
//  - loom 1.17's fabricApi.configureTests registers the run config under the
//    name 'clientGameTest' (task runClientGameTest), whose RunConfigSettings
//    exposes programArgs(String...)/vmArg(String).
// With no -P the game boots on vanilla DEFAULT — which is OpenGL-first in
// 26.2 — and the test's expectation defaults to the GL path to match.
loom {
	runs {
		// One run directory per Minecraft version (2026-09-20): the
		// canonical version keeps `run`, every other target gets
		// `run-mc<version>`, so a world saved by one game version is never
		// opened - and silently upgraded - by another.
		//
		// ONLY the ordinary client run. The gametest client keeps Loom's
		// default, build/run/clientGameTest, which Loom clears before every
		// run (FabricApiTesting: clearRunDirectory / deleteGameTestRunDir):
		// nothing persists there, so it needs no per-version split, and
		// pointing it at the folder that holds the owner's worlds and
		// options would have wiped them on the next suite run.
		named('client') {
			runDir(project.mc_is_canonical ? 'run' : "run-mc${project.mc}".toString())
		}
		// The ORDINARY client run, so the quick-play boot path can be
		// exercised on this loader too. It is not covered by the gametest
		// suite and cannot be: every test class reaches a world through
		// the title screen, which is exactly the route that hid the gate
		// bug (docs/unreleased/farfield/FARFIELD-WAVES.md, "A HARNESS BLIND SPOT").
		//   -Pmeshelium.backend=vulkan
		//   -Pmeshelium.world=<name in fabric/run/saves>
		//   -Pmeshelium.vmargs="-Dk=v"
		named('client') {
			if (project.hasProperty('meshelium.backend')) {
				def backend = project.property('meshelium.backend').toString().toLowerCase()
				if (!['opengl', 'vulkan', 'default'].contains(backend)) {
					throw new IllegalArgumentException(
							"meshelium.backend must be opengl, vulkan or default; got '${backend}'")
				}
				programArgs '--graphicsBackend', backend
			}
			if (project.hasProperty('meshelium.world')) {
				programArgs '--quickPlaySingleplayer',
						project.property('meshelium.world').toString()
			}
			if (project.hasProperty('meshelium.vmargs')) {
				project.property('meshelium.vmargs').toString().trim().split(/\s+/).each { vmArg it }
			}
		}
		named('clientGameTest') {
			if (project.hasProperty('meshelium.backend')) {
				def mesheliumBackend = project.property('meshelium.backend').toString().toLowerCase()
				if (!['opengl', 'vulkan', 'default'].contains(mesheliumBackend)) {
					throw new IllegalArgumentException("meshelium.backend must be opengl, vulkan or default; got '${mesheliumBackend}'")
				}
				programArgs '--graphicsBackend', mesheliumBackend
				vmArg "-Dmeshelium.test.expectBackend=${mesheliumBackend}"
			}
			// `-Pmeshelium.res=1920x1080` sets the client window size.
			// THIS MATTERS MORE THAN IT LOOKS. The harness window defaults
			// to 854x480, which is 0.41 megapixels: a fifth of 1080p, a
			// ninth of 1440p, a twentieth of 4K. Anything whose cost scales
			// with PIXELS is therefore measured at a fraction of its real
			// price, and the occlusion passes are exactly that. The owner
			// played at 1440p and found occlusion culling LOSING at render
			// distance 64, while the 854x480 bench had it winning by 63
			// percent (2026-08-11). Benchmarks that inform a default must
			// run at a resolution somebody actually plays at.
			// vanilla Main options verified by javap: "width" ip 423,
			// "height" ip 452.
			if (project.hasProperty('meshelium.res')) {
				def res = project.property('meshelium.res').toString()
				def m = (res =~ /^(\d{3,5})x(\d{3,5})$/)
				if (!m.matches()) {
					throw new IllegalArgumentException("meshelium.res must look like 1920x1080; got '${res}'")
				}
				programArgs '--width', m.group(1), '--height', m.group(2)
			}
			// Wave-2 harness support: `-Pmeshelium.hello=true` arms the
			// hello-meshlet draw (system property meshelium.helloMeshlet —
			// HelloMeshletRenderer's second gate; the first is the wave-1
			// backend gate). Only meaningful together with
			// -Pmeshelium.backend=vulkan; on the GL run the gate keeps the
			// renderer class from ever loading, so the GL path is untouched
			// with or without this flag.
			if (project.hasProperty('meshelium.hello')) {
				vmArg '-Dmeshelium.helloMeshlet=true'
			}
			// Wave-4 harness support: `-Pmeshelium.terrain=true` arms the real
			// terrain drawer + the vanilla-OPAQUE kill switch (system property
			// meshelium.terrainDraw; TerrainDrawer re-reads it every frame, so
			// the gametest can flip it live for the vanilla-twin screenshot).
			// Only meaningful with -Pmeshelium.backend=vulkan; on GL the gate
			// keeps every terrain-draw class from loading.
			if (project.hasProperty('meshelium.terrain')) {
				vmArg '-Dmeshelium.terrainDraw=true'
			}
			// `-Pmeshelium.probe.greedy=true` arms GreedyMeshProbe: every
			// decoded section is run through a real greedy merge, the result
			// counted, and the merge thrown away. Measurement only, nothing
			// rendered changes. It costs CPU on every build worker, so it is
			// a property and never a setting.
			if (project.hasProperty('meshelium.probe.greedy')) {
				vmArg '-Dmeshelium.probe.greedy=true'
			}
			// `-Pmeshelium.seed=<seed>` picks a different world for the bench.
			// The default 4242 is fixed for comparability, which is right for
			// frame timings and wrong for anything that depends on what the
			// terrain is MADE of: the owner pointed out 4242's spawn is heavy
			// on snow and ice, and ice is a single-variant block that merges
			// far better than grass. A biome-sensitive measurement has to be
			// taken on more than one world.
			if (project.hasProperty('meshelium.seed')) {
				vmArg "-Dmeshelium.bench.seed=${project.property('meshelium.seed')}"
			}
			// Wave-9 harness support.
			// `-Pmeshelium.bench=<scene>` turns the run into a BENCHMARK run:
			// the gametest entrypoint list is swapped to exactly
			// MesheliumBenchmarkTest (see processGametestResources below) and
			// the scene name + the terrain property reach the runtime. Use
			// with -Pmeshelium.backend=vulkan only.
			if (project.hasProperty('meshelium.bench')) {
				def benchScene = project.property('meshelium.bench').toString()
				if (!(benchScene ==~ /[a-z0-9\-]+/)) {
					throw new IllegalArgumentException("meshelium.bench must be a scene name like plains-rd16; got '${benchScene}'")
				}
				vmArg "-Dmeshelium.bench=${benchScene}"
				vmArg '-Dmeshelium.terrainDraw=true'
			}
			// Wave-10 harness support: `-Pmeshelium.rd=<chunks>` (e.g. 48) arms
			// the extended-render-distance leg. It sets BOTH halves:
			//  - meshelium.maxRenderDistance — the config-override property
			//    (must exist at boot: the Options ctor mixin widens the
			//    vanilla option range from it BEFORE options.txt loads), and
			//  - meshelium.test.rd — tells the gametests which rd value to
			//    exercise (Vulkan+terrain run: the rd leg + screenshot
			//    95_meshelium_rd48; GL run: the clamp-back assertions).
			if (project.hasProperty('meshelium.rd')) {
				def mesheliumRd = project.property('meshelium.rd').toString()
				// 120 = the wave-15 hard max (MesheliumConfig.MAX_MAX_RENDER_DISTANCE;
				// the requested view distance is a signed byte on the wire).
				if (!(mesheliumRd ==~ /\d+/) || mesheliumRd.toInteger() < 32 || mesheliumRd.toInteger() > 120) {
					throw new IllegalArgumentException("meshelium.rd must be a chunk count in 32..120; got '${mesheliumRd}'")
				}
				vmArg "-Dmeshelium.maxRenderDistance=${mesheliumRd}"
				vmArg "-Dmeshelium.test.rd=${mesheliumRd}"
			}
			// Workgroup sweep knobs (per-session by design — pipelines cache
			// the resolved values at first creation; one run per value):
			// `-Pmeshelium.wg=<quads>`       → MESHELIUM_WG_SIZE      (default 32, max 64)
			// `-Pmeshelium.taskwg=<sections>` → MESHELIUM_TASK_WG_SIZE (default 32, max 128)
			if (project.hasProperty('meshelium.wg')) {
				vmArg "-Dmeshelium.tune.meshWorkgroupQuads=${project.property('meshelium.wg')}"
			}
			if (project.hasProperty('meshelium.taskwg')) {
				vmArg "-Dmeshelium.tune.taskWorkgroupSections=${project.property('meshelium.taskwg')}"
			}
			// `-Pmeshelium.frontToBack=false` disables the wave-9 opaque
			// front-to-back ordering (default ON; the A/B is shots 40/41).
			if (project.hasProperty('meshelium.frontToBack')) {
				vmArg "-Dmeshelium.tune.frontToBack=${project.property('meshelium.frontToBack')}"
			}
			// `-Pmeshelium.translucentMultiWG=true` arms the ledger-17
			// EXPERIMENT for the translucent parity scene (shots 60/61).
			if (project.hasProperty('meshelium.translucentMultiWG')) {
				vmArg "-Dmeshelium.translucentMultiWG=${project.property('meshelium.translucentMultiWG')}"
			}
			// `-Pmeshelium.gpuTimers=false` kills the (default-ON, pixel-
			// neutral) per-pass timestamp writes — the timer-overhead A/B.
			if (project.hasProperty('meshelium.gpuTimers')) {
				vmArg "-Dmeshelium.gpuTimers=${project.property('meshelium.gpuTimers')}"
			}
			// Wave-12 harness support.
			// `-Pmeshelium.cpustages=true|false` arms/disarms the CPU stage
			// attribution outside bench runs (bench runs arm it by default —
			// MesheliumCpuStages.ARMED falls back to the bench property).
			if (project.hasProperty('meshelium.cpustages')) {
				vmArg "-Dmeshelium.cpustages=${project.property('meshelium.cpustages')}"
			}
			// `-Pmeshelium.skipVanillaPrep=true` arms the wave-12 candidate:
			// skip vanilla's prepareChunkRenders work product on frames
			// Meshelium owns (default OFF; consumer census in
			// docs/VANILLA-FRAME-PATH.md wave-12 notes).
			if (project.hasProperty('meshelium.skipVanillaPrep')) {
				vmArg "-Dmeshelium.tune.skipVanillaPrep=${project.property('meshelium.skipVanillaPrep')}"
			}
			// `-Pmeshelium.cachedCull=true` arms the wave-12 candidate: exact
			// memoization of the occlusion dispatch-list build (default OFF;
			// wins on still frames — the bench's static camera measures the
			// UPPER BOUND, see the TerrainDrawer honesty note).
			if (project.hasProperty('meshelium.cachedCull')) {
				vmArg "-Dmeshelium.tune.cachedCull=${project.property('meshelium.cachedCull')}"
			}
			// Wave-14 harness support: `-Pmeshelium.vkvalidation=true` arms
			// vanilla's own --vulkanValidation launch arg (documented in
			// docs/VANILLA-VULKAN-SEAM.md next to --graphicsBackend). Used
			// for the arena grow-and-copy fence leg: the validation layer
			// independently catches any use-after-free on the outgrown,
			// parked backing. Requires VK_LAYER_KHRONOS_validation on the
			// machine; if absent the game logs the miss and runs
			// unvalidated (check the log, never assume the leg validated).
			if (project.hasProperty('meshelium.vkvalidation')) {
				programArgs '--vulkanValidation'
				// Plain validation catches API misuse. SYNCHRONIZATION
				// validation is a separate opt-in and it is the one that
				// matters for GPU-written indirect commands and for the
				// fence/parked-backing legs: it is what detects a missing
				// barrier between a shader write and a later read, which
				// is otherwise invisible until it corrupts a frame on
				// somebody else's driver.
				environmentVariable 'VK_LAYER_ENABLES',
						'VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT'
			}
			// Keep third-party OVERLAY layers out of the process. They are
			// registered as IMPLICIT layers in the registry, which means the
			// loader injects them into EVERY Vulkan application whether or
			// not their host program is running: Steam's overlay and its
			// Fossilize pipeline-capture layer, the OBS capture hook, Epic
			// Online Services, and whatever else a launcher installed. They
			// are not free, Fossilize in particular intercepts pipeline
			// creation, and they make a benchmark depend on the state of the
			// desktop rather than on the renderer. Defaults ON for bench and
			// test runs so measurements are insulated by construction;
			// `-Pmeshelium.allowImplicitLayers=true` restores the player's
			// real environment for a compatibility check.
			// VK_LOADER_LAYERS_DISABLE is loader 1.3.234+; older loaders
			// ignore it, so this can only ever be a no-op, never a break.
			if (!project.hasProperty('meshelium.allowImplicitLayers')) {
				environmentVariable 'VK_LOADER_LAYERS_DISABLE', '~implicit~'
			}
			// Far-field W4 harness support: `-Pmeshelium.farfield` arms the
			// far-armed legs of MesheliumFarFieldTest (extraction, far draw
			// with screenshots, the both-directions radius leg). It sets
			// ONLY the test flag, never meshelium.farfield.enabled: that
			// test turns the master switch on around its own legs and clears
			// it in a finally, so the other four test classes never inherit
			// an armed far field. Without this property the class still runs
			// its store round-trip leg and its zero-cost-off leg, which are
			// the two that must hold on EVERY run.
			// Use with -Pmeshelium.backend=vulkan -Pmeshelium.terrain.
			if (project.hasProperty('meshelium.farfield')) {
				vmArg '-Dmeshelium.test.farfield=true'
			}
			// The pre5 instrument: `-Pmeshelium.farvisual` arms
			// MesheliumFarFieldVisualTest, the only thing in the suite that
			// photographs the far field in a world that HAS oceans, forests
			// and cliffs in it. Every other class runs in the harness
			// superflat, where a gray ocean, a wrong leaf colour and a holed
			// cliff side are all structurally invisible, which is why every
			// appearance claim this project has made so far came from javap
			// and PNG assets rather than from a rendered pixel.
			// Same shape as -Pmeshelium.farfield above: it sets ONLY the test
			// flag, never meshelium.farfield.enabled. That test arms the
			// master switch itself around its own scenes and clears it in a
			// finally, so MesheliumFarFieldTest's zero-cost-off leg - which
			// runs earlier in the list and asserts FarFieldResidency was never
			// even LOADED - stays valid on this run too.
			// Use with -Pmeshelium.backend=vulkan -Pmeshelium.terrain, and
			// -Pmeshelium.res=1920x1080: the default 854x480 window turns a
			// two-chunk hole in the horizon into a handful of pixels.
			if (project.hasProperty('meshelium.farvisual')) {
				vmArg '-Dmeshelium.test.farvisual=true'
			}
			// The pre21 instrument: `-Pmeshelium.farbench` arms
			// MesheliumFarFieldBenchTest, the only thing in this repo that
			// can price the far field in FRAMES. The existing benchmark
			// (`-Pmeshelium.bench`) arms terrainDraw and NOT the far field,
			// and pins its camera, so it never loads a chunk and never
			// saves one - which is why the owner's "saving the chunks to
			// lod drops 200 to 60" has no number anywhere in this project.
			// Phase 1 of docs/unreleased/farfield/FARFIELD-PERF-BRIEF.md; every later phase of
			// that plan is gated on it.
			//
			// TWO properties, and the second is not optional:
			//  - meshelium.test.farbench arms the test class AND, through
			//    MesheliumBenchRecorder.FARBENCH_PROPERTY, the per-frame
			//    clock the near-field benchmark already owns (one sample
			//    per rendered frame, into a preallocated array). Per-TICK
			//    sampling is 20 Hz and cannot see a frame at all.
			//  - meshelium.farfield.perfStats arms ExtractDispatch's
			//    per-slice and per-column distributions. They sit behind a
			//    static final so a played session pays nothing, and
			//    without them every fraction-of-frame figure in the report
			//    would be a zero meaning "unmeasured" rather than "free" -
			//    so the test refuses to run in that state rather than
			//    publish it.
			//
			// Same shape as the two flags above: it sets ONLY test flags,
			// never meshelium.farfield.enabled. The bench arms the master
			// switch itself around its own scenarios and clears it in a
			// finally.
			//
			// Use with -Pmeshelium.backend=vulkan -Pmeshelium.terrain; the
			// class hard-fails without either, because on the OpenGL path
			// the residency pump never runs, the far field is never
			// pumped, and both arms of the A/B would be identical by
			// construction.
			if (project.hasProperty('meshelium.farbench')) {
				vmArg '-Dmeshelium.test.farbench=true'
				vmArg '-Dmeshelium.farfield.perfStats=true'
			}
			// The zero-cost-off leg asserts that two far-field classes were
			// never LOADED, and the only thing in a plain JVM that answers
			// "was this class ever defined" without defining it is
			// ClassLoader.findLoadedClass, which is protected in java.base
			// (Class.forName(name, false, loader) still defines the class;
			// ClassLoadingMXBean counts classes without naming them). The
			// leg refuses to pass on an unavailable probe, so this open is
			// what keeps that assertion from turning into a suite failure.
			// Test-runtime only; nothing shipped reflects into java.base.
			vmArg '--add-opens=java.base/java.lang=ALL-UNNAMED'
			// Generic diagnostic passthrough: `-Pmeshelium.vmargs="-Dk=v -Dk2=v2"`
			// forwards arbitrary -D flags to the client JVM (coordinator
			// debugging tool — e.g. meshelium.debugStats, terrainDraw.bfsOnly —
			// without dedicating a -P to every property).
			if (project.hasProperty('meshelium.vmargs')) {
				project.property('meshelium.vmargs').toString().trim().split(/\s+/).each { vmArg it }
			}
		}
	}
}

// Wave-9: the benchmark swaps the gametest ENTRYPOINT LIST — with
// -Pmeshelium.bench the run registers ONLY MesheliumBenchmarkTest, without it
// the normal seven tests (and never the benchmark). The gametest
// fabric.mod.json carries a ${gametest_entrypoints} placeholder expanded
// here; the source set is 'gametest' (fabricApi.configureTests
// createSourceSet = true; the bin/gametest output dir confirms the name),
// so its ProcessResources task is processGametestResources — a wrong task
// name fails loudly at configuration time, never silently.
def mesheliumBenchScene = project.hasProperty('meshelium.bench') ?
		project.property('meshelium.bench').toString() : ''
// The two far-field classes are LAST on purpose, in this order. They are
// the only tests that turn the far field on, and although each clears the
// master switch in a finally, an armed far field changes what the other
// classes can assert (far shells set the same RegionStore retained bit as
// the wave-11 horizon). Running them last means nothing downstream can
// inherit that state.
//
// MesheliumFarFieldTest must come BEFORE MesheliumFarFieldVisualTest, and
// that ordering is load bearing rather than cosmetic: its zero-cost-off leg
// asserts that FarFieldResidency has never been LOADED in a session that
// never enabled the far field, and it can only prove that from a cold
// start. Both classes keep every reference to that class inside a nested
// FarWalkerProbe so merely being constructed cannot load it, but the order
// is the belt to that pair of braces.
//
// MesheliumFarFieldBenchTest is last of all, after both of them. It is
// inert without -Pmeshelium.farbench (an ARMED check and an immediate
// return, the farvisual shape), so its place in the normal list costs a
// suite run nothing and keeps it from becoming the class nobody notices
// has stopped being registered.
def mesheliumNormalTests = ['MesheliumBootSmokeTest', 'MesheliumTerrainDataTest',
		'MesheliumTerrainResidencyTest', 'MesheliumTerrainDrawTest',
		'MesheliumLifecycleTortureTest', 'MesheliumFarFieldTest',
		'MesheliumFarFieldVisualTest', 'MesheliumFarFieldBenchTest'].collect {
			"\"com.deds.meshelium.gametest.client.${it}\""
		}.join(',\n\t\t\t')
// A far-bench run is a MEASUREMENT, so by default it registers that class
// and nothing else - the same swap -Pmeshelium.bench performs, for the
// same two reasons. First, twenty minutes of other tests ahead of a
// frame-time distribution heats the machine and leaves the measurement
// carrying their thermal tail. Second, the A/B this instrument exists for
// is two back-to-back runs (far on, far off), and a pair of five-minute
// preludes is an hour of serialised run budget spent on tests nobody is
// reading. `-Pmeshelium.farbench.suite` keeps the ordinary list instead,
// with the bench appended, for a run that wants both.
def mesheliumFarBenchAlone = project.hasProperty('meshelium.farbench') &&
		!project.hasProperty('meshelium.farbench.suite')
// -Pmeshelium.sodium swaps the list to the stand-down test alone, for the
// same reason the bench modes do: the ordinary suite asserts that
// Meshelium RENDERS, and under Sodium it deliberately does not, so those
// tests would fail correctly and prove nothing. The stand-down test
// asserts the behaviour that is actually wanted there.
//
// The bench modes take precedence over it deliberately. -Pmeshelium.sodium
// does two separable things - put Sodium on the classpath, and choose what
// to run - and only the first is wanted when it is combined with a bench.
// `-Pmeshelium.sodium -Pmeshelium.bench=<scene>` is how Sodium gets
// MEASURED: the bench's vanillaOnly leg times whatever the host renderer
// is, and with Sodium installed and Meshelium stood down by the gate, the
// host renderer IS Sodium.
def mesheliumSodiumRun = project.hasProperty('meshelium.sodium')
def mesheliumGametestEntrypoints
if (mesheliumBenchScene) {
	mesheliumGametestEntrypoints =
			'"com.deds.meshelium.gametest.client.MesheliumBenchmarkTest"'
} else if (mesheliumSodiumRun) {
	mesheliumGametestEntrypoints =
			'"com.deds.meshelium.gametest.client.MesheliumSodiumStandDownTest"'
} else if (mesheliumFarBenchAlone) {
	mesheliumGametestEntrypoints =
			'"com.deds.meshelium.gametest.client.MesheliumFarFieldBenchTest"'
} else {
	mesheliumGametestEntrypoints = mesheliumNormalTests
}
tasks.named('processGametestResources', ProcessResources) {
	inputs.property 'meshelium_bench', mesheliumBenchScene
	inputs.property 'meshelium_farbench', mesheliumFarBenchAlone
	inputs.property 'meshelium_sodium', mesheliumSodiumRun
	// The EXPANDED VALUE must be an input, not just the bench scene.
	// Without this, adding a class to mesheliumNormalTests does not
	// invalidate the task: Gradle sees the same declared inputs and the
	// same template file, calls processGametestResources UP-TO-DATE, and
	// leaves the previously generated fabric.mod.json in place. The new
	// test is then never registered as an entrypoint, never runs, and the
	// suite goes GREEN having silently skipped it — which is exactly what
	// happened to MesheliumFarFieldTest on 2026-08-19 (five entrypoints
	// generated, six declared; the far-armed run produced the same 28
	// screenshots as the plain one and no far-field log line at all).
	inputs.property 'meshelium_gametest_entrypoints', mesheliumGametestEntrypoints
	filesMatching('fabric.mod.json') {
		expand 'gametest_entrypoints': mesheliumGametestEntrypoints
	}
}

// LGPL-3.0-only conveyance: the licence text must accompany the binary.
// Modrinth hands a player the jar on its own, detached from the repo, so
// the repo's LICENSE file is not enough - 1.5.2 shipped 198 entries and
// none of them was the licence. Named with the mod suffix so it cannot
// collide with a licence from another jar when a launcher merges them.
jar {
	from(rootProject.file('LICENSE')) {
		rename { "${it}_meshelium" }
	}
}

// No sources jar is built. The LGPL-3.0-only source obligation is met by
// publishing this build's code to the public repo by hand,
// which is the practice every release so far has followed - eight published
// versions, none of them with a sources jar attached. Building one only
// produced a 1.2 MB artifact nobody uploads, sitting in release/ next to the
// files that DO get uploaded.

processResources {
	def v = project.version
	def build = project.mesheliumBuildExpansion
	inputs.property 'version', v
	inputs.property 'build', build.toString()
	// The manifest's minecraft dependency and the build-info resource the
	// jar reads at runtime (MesheliumBuild) both come from the one map the
	// root build derived from versions/mc<target>.properties.
	filesMatching('fabric.mod.json') {
		expand(['version': v] + build)
	}
	filesMatching('meshelium-build.properties') {
		expand build
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// The root censuses, wired in here so a plain `./gradlew build` runs them.
// (checkSodiumCoordinate, which used to be called here at configuration
// time, is gone since 2026-09-20: the Modrinth coordinate and the version
// the jar reports are now both derived from one property, so there are no
// longer two copies to compare.)
tasks.named('check') {
	dependsOn rootProject.tasks.named('checkLangKeys')
	dependsOn rootProject.tasks.named('checkVersionedSources')
}
