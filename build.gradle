import java.util.regex.Matcher
import java.util.regex.Pattern

// Meshelium — cross-vendor mesh-shader terrain renderer on Minecraft 26.2's
// vanilla Vulkan backend.
//
// SPLIT LAYOUT, since the NeoForge port. The renderer lives in common/ as
// plain source — 106 files of vanilla, LWJGL and Vulkan, including all 38
// mixins, which target vanilla classes and are not loader-specific. The
// Sodium adapter lives beside it in sodium/, a second shared tree that
// both loaders compile (NeoForge since 2026-09-14). Each loader project
// compiles that source itself and adds only its entrypoint and its
// implementation of MesheliumPlatform.Services, which is the whole of
// what this mod asks a loader for: the game directory, the config
// directory, an end-of-client-tick callback, isDevelopment, isModLoaded,
// sodiumAdapterAvailable and modVersion.
//
// THE RULE FOR WHAT GOES WHERE: if it names a loader API it cannot be in
// common/. Nothing there does, and a grep for net.fabricmc under common/
// returning anything is a bug.
//
// WHY NOT ARCHITECTURY, since the obvious answer to "one source, two
// loaders" is Architectury and there is a working template of exactly that
// on this machine. Two reasons, the first measured rather than assumed:
//
//   1. Its dev runtime breaks our verification. Architectury replaces the
//      launch main class in dev runs, and its classpath scanner leaves two
//      unnamed 16-thread pools (one per CPU, on this 16-CPU machine) alive
//      and NON-DAEMON after the client shuts down. The JVM then cannot
//      exit, vanilla's ClientShutdownWatchdog fires ~16 s later, and the
//      process dies with NTSTATUS 0xFFFFFFF8. Reproduced twice, with all
//      tests passing and 28 screenshots taken both times. Our own four
//      threads are named and explicitly daemon and were ruled out from the
//      crash dump. That turns every green run into a red exit code, and
//      exit code is how this project gates every change.
//   2. We would be paying for a transformer we no longer need. Its main
//      job is remapping loader annotations across platforms, and common/
//      has none left: the nine @Environment annotations were deleted, and
//      the loader services went behind a plain interface.
//
// So each loader project simply adds common/ to its own source set. Shared
// code is compiled twice, which costs seconds, and the Fabric build stays
// byte-for-byte the toolchain that has gated this project all along.

// ======================================================================
// THE MINECRAFT TARGET (2026-09-20)
//
// One source tree, several Minecraft versions. versions/README.md is the
// manual; this block is the machinery. It runs before either loader
// project is evaluated (Gradle configures the root first), so everything
// it puts in `ext` is a plain `project.foo` by the time fabric/build.gradle
// and neoforge/build.gradle read it - the same names the two scripts read
// out of gradle.properties before 2026-09-20.
// ======================================================================

def mesheliumTarget = rootProject.property('mc').toString().trim()
def mesheliumCanonical = rootProject.property('mc_canonical').toString().trim()
def mesheliumTargetFile = rootProject.file("versions/mc${mesheliumTarget}.properties")
if (!mesheliumTargetFile.isFile()) {
	def known = rootProject.file('versions').listFiles()
			.findAll { it.name ==~ /mc.+\.properties/ }
			.collect { it.name.replaceAll(/^mc|\.properties$/, '') }
			.sort()
	throw new GradleException("Unknown Minecraft target mc=${mesheliumTarget}: there is no "
			+ "versions/mc${mesheliumTarget}.properties. Known targets: ${known}. "
			+ "See versions/README.md.")
}
def mesheliumTargetProps = new Properties()
mesheliumTargetFile.withInputStream { mesheliumTargetProps.load(it) }
['minecraft_version', 'loader_version', 'fabric_api_version', 'neoforge_version',
 'sodium_base_version'].each { key ->
	if (!mesheliumTargetProps.getProperty(key)?.trim()) {
		throw new GradleException("versions/mc${mesheliumTarget}.properties is missing ${key}")
	}
}
def mesheliumMinecraft = mesheliumTargetProps.getProperty('minecraft_version').trim()
if (mesheliumMinecraft != mesheliumTarget) {
	throw new GradleException("versions/mc${mesheliumTarget}.properties says minecraft_version="
			+ "${mesheliumMinecraft}; the file name and the property must agree")
}
// The exclusive upper bound for a "[26.3,26.4)" range: bump the last
// component. Minecraft's versions have been <year>.<n> since 26.1.
def mesheliumMinecraftNext = {
	def parts = mesheliumMinecraft.split(/\./)
	if (parts.length < 2 || !(parts[-1] ==~ /\d+/)) {
		throw new GradleException("Cannot derive the next version after ${mesheliumMinecraft}")
	}
	parts[-1] = (parts[-1].toInteger() + 1).toString()
	parts.join('.')
}()
def mesheliumSodiumBase = mesheliumTargetProps.getProperty('sodium_base_version').trim()

allprojects {
	ext.mc = mesheliumTarget
	ext.mc_is_canonical = (mesheliumTarget == mesheliumCanonical)
	ext.minecraft_version = mesheliumMinecraft
	ext.minecraft_version_next = mesheliumMinecraftNext
	ext.loader_version = mesheliumTargetProps.getProperty('loader_version').trim()
	ext.fabric_api_version = mesheliumTargetProps.getProperty('fabric_api_version').trim()
	ext.neoforge_version = mesheliumTargetProps.getProperty('neoforge_version').trim()
	// Sodium: ONE base version, three derived strings. The Modrinth
	// coordinate is <mcversion>-<version>-<loader> and the version the
	// loader reports is <version>+<mcversion> (unzip -p fabric.mod.json of
	// the shipped jar). Deriving all three from one property is what makes
	// "bump both or neither" true by construction; until 2026-09-20 a
	// configuration-time check compared two hand-kept copies instead.
	ext.sodium_version = "mc${mesheliumMinecraft}-${mesheliumSodiumBase}-fabric".toString()
	ext.sodium_neoforge_version = "mc${mesheliumMinecraft}-${mesheliumSodiumBase}-neoforge".toString()
	ext.sodium_built_against = "${mesheliumSodiumBase}+mc${mesheliumMinecraft}".toString()
	ext.sodium_also_matching = (mesheliumTargetProps.getProperty('sodium_also_matching') ?: '').trim()
	// -XX:StackShadowPages this version's launch profile passes; 0 = none, check off.
	ext.launch_shadow_pages = (mesheliumTargetProps.getProperty('launch_shadow_pages') ?: '0').trim()
	// 1.6.1+mc26.3: the mod version and the game it is for, in one string,
	// the shape Sodium uses. This is the jar's version on both loaders.
	ext.mod_version_full = "${rootProject.mod_version}+mc${mesheliumMinecraft}".toString()
	// What processResources expands into meshelium-build.properties and the
	// two manifests. One map so the loaders cannot expand different values.
	ext.mesheliumBuildExpansion = [
			'minecraft_target'      : mesheliumMinecraft,
			'minecraft_version'     : mesheliumMinecraft,
			'minecraft_version_next': mesheliumMinecraftNext,
			'sodium_built_against'  : ext.sodium_built_against,
			'sodium_also_matching'  : ext.sodium_also_matching,
			'launch_shadow_pages'   : ext.launch_shadow_pages,
	]
}

// ---- the rename table for a derived target ---------------------------
// versions/mc<target>/renames.txt: "<canonical FQN> <target FQN>" per line.
// Both the dotted form (imports, code) and the slashed form (mixin
// descriptor strings such as "Lcom/mojang/blaze3d/vulkan/VulkanConst;")
// are applied. Longest names first, and a name only matches when the next
// character is not an identifier character, so a rename of GpuBuffer can
// never eat GpuBufferSlice. Absent file = no renames.
def mesheliumRenameFile = rootProject.file("versions/mc${mesheliumTarget}/renames.txt")
def mesheliumRenamePairs = []
if (mesheliumRenameFile.isFile()) {
	mesheliumRenameFile.eachLine { line ->
		def t = line.trim()
		if (!t || t.startsWith('#')) {
			return
		}
		def parts = t.split(/\s+/)
		if (parts.length != 2 || parts[0] == parts[1]) {
			throw new GradleException("${mesheliumRenameFile}: expected '<canonical> <target>', got: ${line}")
		}
		mesheliumRenamePairs << [parts[0], parts[1]]
		mesheliumRenamePairs << [parts[0].replace('.', '/'), parts[1].replace('.', '/')]
	}
	mesheliumRenamePairs.sort { -it[0].length() }
}
def mesheliumRenamePatterns = mesheliumRenamePairs.collect { pair ->
	[Pattern.compile(Pattern.quote(pair[0]) + '(?![A-Za-z0-9_])'), Matcher.quoteReplacement(pair[1])]
}
ext.mesheliumRenameLine = { String line ->
	def out = line
	for (p in mesheliumRenamePatterns) {
		out = p[0].matcher(out).replaceAll(p[1])
	}
	return out
}

/**
 * A source root, as this target sees it: a LIST of directories to hand to
 * `java.srcDirs` / `resources.srcDirs`.
 *
 * For the canonical target that is the real directory plus its own
 * overlay, untouched, so the IDE and the compiler look at the same files.
 * For a derived target it is one Sync task's output under
 * <project>/build/versioned/mc<target>/: the shared root copied through
 * the rename table (Java files only), with every file that the overlay
 * versions/mc<target>/<root> also holds taken from the overlay instead,
 * and any overlay-only file added. That element is a Provider carrying
 * the task dependency, so the source set wires the generation in.
 *
 * Called once per (project, root) - the two loaders each compile common/
 * and sodium/ and each get their own copy, which costs a second and keeps
 * the task graph free of cross-project outputs.
 */
ext.versionedRoot = { Project p, String rel ->
	def base = rootProject.file(rel)
	def overlay = rootProject.file("versions/mc${mesheliumTarget}/${rel}")
	if (rootProject.ext.mc_is_canonical) {
		// The canonical version compiles the shared tree and its own overlay
		// directory as they are - no copy, so the IDE and javac read the
		// same files. Its overlay holds the files that exist ONLY on the
		// canonical version (checkVersionedSources refuses one that
		// shadows a shared file, which would be a duplicate class).
		return overlay.isDirectory() ? [base, overlay] : [base]
	}
	def shadowed = []
	if (overlay.isDirectory()) {
		overlay.eachFileRecurse { f ->
			if (f.isFile()) {
				shadowed << overlay.toPath().relativize(f.toPath()).toString().replace('\\', '/')
			}
		}
	}
	def taskName = 'versionedSources_' + rel.replaceAll(/[^A-Za-z0-9]+/, '_')
	def task = p.tasks.register(taskName, Sync) {
		group = 'build setup'
		description = "Derives ${rel} for Minecraft ${mesheliumTarget}: rename table + overlay"
		into p.layout.buildDirectory.dir("versioned/mc${mesheliumTarget}/${rel}")
		inputs.files(mesheliumRenameFile).withPropertyName('renames')
		inputs.property('shadowed', shadowed.toString())
		from(base) {
			exclude shadowed
			filesMatching('**/*.java') {
				filter { String line -> rootProject.ext.mesheliumRenameLine(line) }
			}
		}
		if (overlay.isDirectory()) {
			from(overlay)
		}
	}
	return [task.map { it.destinationDir }]
}

// ======================================================================
// BUILD-TIME CENSUSES (2026-09-16)
//
// Facts that used to be true only by memory, and that a green build then
// certified as still true. They live at the root because they read
// common/ and sodium/, which are plain shared source rather than Gradle
// projects of their own.
// ======================================================================

/**
 * The versioned layout's own rules, checked. Every rename line parses
 * (already enforced above); the canonical version's overlay holds only
 * files the shared tree does not have (a shadowing file there would be a
 * duplicate class, since the canonical build compiles both directories
 * as they are); and no overlay file for a derived target still names a
 * canonical class the rename table would have rewritten - an overlay is
 * written in its own version's vocabulary and is never filtered, so such
 * a name would compile against the wrong class or not at all. Prints
 * what it counted, including what it skipped.
 */
tasks.register('checkVersionedSources') {
	group = 'verification'
	description = 'The versions/ layout obeys versions/README.md.'
	def versionsDir = rootProject.file('versions')
	inputs.dir(versionsDir).withPropertyName('versions')
	inputs.property('canonical', mesheliumCanonical)
	def stamp = layout.buildDirectory.file('checkVersionedSources.txt')
	outputs.file(stamp).withPropertyName('stamp')
	doLast {
		def report = []
		int targets = 0
		versionsDir.listFiles().findAll { it.isDirectory() && it.name ==~ /mc.+/ }.sort().each { dir ->
			targets++
			def target = dir.name.substring(2)
			def canonical = (target == mesheliumCanonical)
			if (!new File(versionsDir, "mc${target}.properties").isFile()) {
				throw new GradleException("versions/${dir.name}/ has no versions/mc${target}.properties beside it")
			}
			def renames = []
			def renameFile = new File(dir, 'renames.txt')
			if (renameFile.isFile()) {
				renameFile.eachLine { line ->
					def t = line.trim()
					if (t && !t.startsWith('#')) {
						def parts = t.split(/\s+/)
						if (parts.length != 2) {
							throw new GradleException("${renameFile}: expected '<canonical> <target>', got: ${line}")
						}
						renames << parts[0]
					}
				}
			}
			int overlayFiles = 0
			int shadowing = 0
			int added = 0
			int skipped = 0
			dir.eachFileRecurse { f ->
				if (!f.isFile() || f == renameFile) {
					return
				}
				def rel = dir.toPath().relativize(f.toPath()).toString().replace('\\', '/')
				overlayFiles++
				if (rootProject.file(rel).isFile()) {
					if (canonical) {
						throw new GradleException("versions/${dir.name}/${rel} shadows a shared file, but "
								+ "${target} is the canonical version and compiles both directories as "
								+ "they are: that is a duplicate class. Move the version-specific file "
								+ "into the shared tree, or the shared one into every OTHER version's "
								+ "overlay.")
					}
					shadowing++
				} else {
					added++
				}
				if (!f.name.endsWith('.java')) {
					skipped++
					return
				}
				def text = f.text
				renames.each { canonicalName ->
					def hit = Pattern.compile(Pattern.quote(canonicalName) + '(?![A-Za-z0-9_])').matcher(text)
					if (hit.find()) {
						throw new GradleException("versions/${dir.name}/${rel} names ${canonicalName}, a "
								+ "canonical class the rename table maps to something else on ${target}. "
								+ "Overlay files are written in their own version's vocabulary and are "
								+ "never filtered; use the ${target} name.")
					}
				}
			}
			report << "mc${target}${canonical ? ' (canonical)' : ''}: ${renames.size()} renames, " +
					"${overlayFiles} overlay files (${shadowing} replacing a shared file, ${added} " +
					"own), ${skipped} non-Java files skipped by the vocabulary scan"
		}
		def line = "checkVersionedSources: canonical mc${mesheliumCanonical}, ${targets} version " +
				"director(y/ies). " + (report ? report.join('; ') : 'none.')
		logger.lifecycle(line)
		def out = stamp.get().asFile
		out.parentFile.mkdirs()
		out.text = line + '\n'
	}
}

/**
 * Every lang key a literal names must exist, and every key must have a
 * literal. BOTH directions, because only one of them fails loudly.
 *
 * Component.translatable falls back to rendering the KEY when the key is
 * missing, so a literal the lang file never got renders the raw string
 * "meshelium.chat.popup.no_mesh" at a player while every test stays green.
 * The other direction is quieter still: a key nothing names is dead
 * weight that reads like coverage, and deleting a row without deleting its
 * key is how that happens.
 *
 * A gametest cannot do this job. It can read en_us.json off the classpath
 * (MesheliumBootSmokeTest.assertLangHasNoLongDashes is the precedent) but
 * it cannot read common/src, so it can only ever check keys against
 * themselves.
 *
 * The em/en dash lint runs here as well as in that gametest. The gametest
 * throws from runTest on BOTH the GL and the Vulkan run, so a dash in a
 * new string costs a whole client run to discover; at build time it costs
 * a second.
 *
 * The task PRINTS its counts, including what it SKIPPED. A census that
 * silently passes over what it cannot parse hides exactly the cases that
 * later break.
 */
tasks.register('checkLangKeys') {
	group = 'verification'
	description = 'Every lang literal has a key, every key has a literal, and no long dashes.'

	// The shared trees plus every version's overlay of them: an overlay file
	// can name a lang key too, and a key only an overlay names must not
	// read as an orphan.
	def sourceRoots = [rootProject.file('common/src/main/java'),
	                   rootProject.file('sodium/src/main/java')]
	rootProject.file('versions').listFiles().findAll { it.isDirectory() && it.name ==~ /mc.+/ }.sort().each { dir ->
		['common/src/main/java', 'sodium/src/main/java'].each { rel ->
			def overlayRoot = new File(dir, rel)
			if (overlayRoot.isDirectory()) {
				sourceRoots << overlayRoot
			}
		}
	}
	def langFile = rootProject.file(
			'common/src/main/resources/assets/meshelium/lang/en_us.json')
	def stamp = layout.buildDirectory.file('checkLangKeys.txt')

	inputs.files(sourceRoots).withPropertyName('sources')
	inputs.file(langFile).withPropertyName('lang')
	outputs.file(stamp).withPropertyName('stamp')

	doLast {
		// The five roots that were already lang keys, plus meshelium.toast.
		// added 2026-09-16 with the remote-world notice. Every other
		// meshelium.* literal in the tree is a system property or a
		// filename (meshelium.sodium.adapter, meshelium.bench,
		// meshelium.test.*, meshelium.farfield.*, meshelium.json), so the
		// root list separates the two by construction rather than by an
		// exclusion list that would rot.
		def langRoots = ['meshelium.options.', 'meshelium.popup.', 'meshelium.chat.',
		                 'meshelium.rd.', 'meshelium.videosettings.', 'meshelium.toast.']
		// A literal ending in '.' is a prefix an enum completes at runtime;
		// each is listed by name so a NEW one cannot be waved through.
		def dynamicPrefixes = ['meshelium.options.farfield.',
		                       'meshelium.options.farfield.preset.',
		                       'meshelium.options.tooltip.farfield.']
		// Keys that legitimately have no literal. EMPTY today, and it stays
		// that way unless something is argued into it right here.
		def allowedWithoutLiteral = []

		def keys = [] as Set
		langFile.eachLine { line ->
			def m = line =~ /^\s*"([^"]+)"\s*:/
			if (m) {
				keys << m[0][1]
			}
		}

		def langText = langFile.text
		def dashSample = null
		for (int i = 0; i < langText.length(); i++) {
			char c = langText.charAt(i)
			if (c == ((char) 0x2014) || c == ((char) 0x2013)) {
				dashSample = langText.substring(Math.max(0, i - 60),
						Math.min(langText.length(), i + 10))
				break
			}
		}
		if (dashSample != null) {
			throw new GradleException("en_us.json contains an em/en dash near: ..." + dashSample
					+ "... Player-facing strings use commas; tooltips carry the detail. "
					+ "MesheliumBootSmokeTest.assertLangHasNoLongDashes throws on this too, "
					+ "on both client runs, which is a whole client boot to find out.")
		}

		def literalPattern = ~/"(meshelium\.[A-Za-z0-9_.]*)"/
		def inRoot = [:]
		int scanned = 0
		int outOfRoot = 0
		sourceRoots.each { root ->
			root.eachFileRecurse { file ->
				if (!file.isFile() || !file.name.endsWith('.java')) {
					return
				}
				int lineNo = 0
				file.eachLine { line ->
					lineNo++
					def m = literalPattern.matcher(line)
					while (m.find()) {
						scanned++
						def literal = m.group(1)
						if (langRoots.any { literal.startsWith(it) }) {
							if (!inRoot.containsKey(literal)) {
								inRoot.put(literal, [])
							}
							inRoot.get(literal).add("${file.name}:${lineNo}".toString())
						} else {
							outOfRoot++
						}
					}
				}
			}
		}

		def dynamicSeen = inRoot.keySet().findAll { it.endsWith('.') }
		def undeclaredDynamic = dynamicSeen.findAll { !dynamicPrefixes.contains(it) }
		if (!undeclaredDynamic.isEmpty()) {
			throw new GradleException("new dynamic lang prefix(es) ${undeclaredDynamic} - add "
					+ "each to dynamicPrefixes in build.gradle beside the enum that completes "
					+ "it, or this census stops being able to see the keys behind them")
		}

		def missing = inRoot.findAll { k, v -> !dynamicSeen.contains(k) && !keys.contains(k) }
		if (!missing.isEmpty()) {
			throw new GradleException("lang key(s) named in source but absent from en_us.json - "
					+ "Component.translatable renders the raw key at the player:\n  "
					+ missing.collect { k, v -> "${k}  (${v.join(', ')})" }.join('\n  '))
		}

		def orphans = keys.findAll { key ->
			!inRoot.containsKey(key) && !dynamicPrefixes.any { key.startsWith(it) } &&
					!allowedWithoutLiteral.contains(key)
		}
		if (!orphans.isEmpty()) {
			throw new GradleException("lang key(s) in en_us.json that no source literal names:\n  "
					+ orphans.sort().join('\n  ')
					+ "\nDelete each with the row it belonged to, or add it to "
					+ "allowedWithoutLiteral with a reason.")
		}

		// The + goes at the END of each line, not the start: outside
		// parentheses Groovy ends the statement at the newline, and a line
		// beginning with + parses as String.positive(), which is the error
		// this shipped with ("No signature of method: java.lang.String
		// .positive()"). Caught by the build, 2026-09-16.
		def report = "checkLangKeys: ${scanned} meshelium.* literals scanned, ${inRoot.size()} " +
				"distinct lang literals, ${keys.size()} keys in en_us.json, ${outOfRoot} " +
				"literals skipped as out-of-root (system properties and filenames), " +
				"${dynamicSeen.size()} dynamic prefixes skipped, 0 missing, 0 orphans."
		logger.lifecycle(report)
		def out = stamp.get().asFile
		out.parentFile.mkdirs()
		out.text = report + '\n'
	}
}
