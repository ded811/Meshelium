modLoader = "javafml"
loaderVersion = "[11,)"
license = "LGPL-3.0-only"
issueTrackerURL = "https://github.com/ded811/Meshelium/issues"

[[mods]]
modId = "meshelium"
version = "${version}"
displayName = "Meshelium"
authors = "Ded811"
displayURL = "https://modrinth.com/mod/meshelium"
# Both, because they are different slots: bannerFile is the wide strip
# and iconFile is the square badge in the mod list. Only the banner was
# set, so the list showed an empty square and stretched a 256x256 logo
# across the banner area. Fabric has had "icon" since 1.0.0.
iconFile = "assets/meshelium/icon.png"
bannerFile = "assets/meshelium/icon.png"
description = '''
Mesh-shader terrain rendering for every GPU that has them, on Minecraft's own Vulkan backend (VK_EXT_mesh_shader): AMD RDNA2+, NVIDIA Turing+, Intel Arc. See a great deal further without the game falling over. Works with Sodium: Sodium builds the chunks, Meshelium draws them.
'''

# The mixin config lives in common/ and is shared byte-for-byte with the
# Fabric build. Both loaders run the same Mixin fork, so the 38 mixin
# classes are identical on both sides.
[[mixins]]
config = "meshelium.client.mixins.json"

# NeoForge only, and one class. NeoForge patches Minecraft's window
# creation to hand over its early loading screen's OpenGL window, which
# Vulkan cannot draw to; this declines the handover so the first launch
# does not crash. Nothing in it exists on Fabric, so it cannot live in the
# shared config. See WindowEarlyDisplayMixin.
[[mixins]]
config = "meshelium.neoforge.mixins.json"

# The Sodium adapter's mixins, the same bytes as the Fabric build's
# (sodium/ is a source set of this jar since 2026-09-14). requiredMods
# keeps FML from registering the config at all when Sodium is absent
# (ModFileParser reads config/requiredMods/behaviorVersion;
# MixinFacade.areRequiredModsPresent logs "not applied as required mod
# 'sodium' is missing" and never hands the config to Mixin); the config's
# own plugin re-checks from inside Mixin so a present-but-declined Sodium
# (-Dmeshelium.sodium.adapter=false) still gets every render mixin
# switched off.
[[mixins]]
config = "meshelium.sodium.mixins.json"
requiredMods = ["sodium"]

# Upper-bounded on purpose. Every one of the shared mixins is pinned to a
# method descriptor in one Minecraft version's bytecode, and NeoForge
# recompiles the whole game, so a NeoForge built for the next version is a
# different set of descriptors. Refusing to load is the correct failure;
# applying half the mixins and rendering nothing is not. The bounds are
# expanded by the build from versions/mc<target>.properties, so the jar
# built for 26.3 says [26.3,26.4) here and the 26.2 one says [26.2,26.3).
[[dependencies.meshelium]]
modId = "neoforge"
type = "required"
versionRange = "[${minecraft_version},${minecraft_version_next})"
ordering = "NONE"
side = "CLIENT"

[[dependencies.meshelium]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},${minecraft_version_next})"
ordering = "NONE"
side = "CLIENT"
