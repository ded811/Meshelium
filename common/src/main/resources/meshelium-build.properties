# Expanded by the build (processResources in fabric/ and neoforge/). Read at
# runtime by com.deds.meshelium.MesheliumBuild. This is the ONLY place the
# jar learns which Minecraft it was built for and which Sodium it was
# written against; both come from versions/mc<target>.properties.
minecraft_target=${minecraft_target}
sodium_built_against=${sodium_built_against}
sodium_also_matching=${sodium_also_matching}
launch_shadow_pages=${launch_shadow_pages}
