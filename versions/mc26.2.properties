# Minecraft 26.2 - the version 1.0.0 through 1.6.0 shipped on. Built with
# `-Pmc=26.2`: the shared sources are copied through versions/mc26.2/renames.txt
# and the files under versions/mc26.2/ replace their same-path originals.
# See versions/README.md.
minecraft_version=26.2

# Same verified toolchain as the sibling attack-of-the-bteam repo.
loader_version=0.19.3
fabric_api_version=0.155.2+26.2

# 26.2 left beta at .57; .75 is the release 1.6.0 was built and proven on
# (.88 is the newest and has no client-side change that matters to us).
neoforge_version=26.2.0.75

# Sodium 0.9.2 for 26.2 (release, 2026-09-11). 1.6.0 was pinned to
# 0.9.2-beta.1, and the two are BYTE-IDENTICAL: every class file matches,
# the only difference in the whole jar is the version string in
# fabric.mod.json (unzip + diff -r, 2026-09-20). So beta.1 is accepted as
# the same Sodium rather than warned about, which is what the second line
# says. Comma-separated if there is ever more than one.
sodium_base_version=0.9.2
sodium_also_matching=0.9.2-beta.1

# 26.2's launch profile passes no -XX:StackShadowPages (it runs on Java 25
# too, but Mojang only added the flag for 26.3), so the launch check is off.
launch_shadow_pages=0
