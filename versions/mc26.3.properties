# Minecraft 26.3 - the CANONICAL target. The shared source trees are written
# in this version's vocabulary; every other target is derived from them.
#
# Read by the root build.gradle for `-Pmc=26.3` (the default in
# gradle.properties). See versions/README.md.
minecraft_version=26.3

# Fabric: loader 0.19.5 and Fabric API 0.161.0+26.3 are the newest for 26.3
# at meta.fabricmc.net / Modrinth on 2026-09-20.
loader_version=0.19.5
fabric_api_version=0.161.0+26.3

# NeoForge: every 26.3 build is a beta so far (26.3.0.0-beta .. 26.3.0.7-beta,
# maven.neoforged.net, 2026-09-20). Needs ModDevGradle 2.0.147 or newer:
# 2.0.146's NeoForm runtime does not know 26.3 and fails recompiling it.
neoforge_version=26.3.0.7-beta

# Sodium 0.9.2 for 26.3, a RELEASE (not a beta) on Modrinth, 2026-09-15.
# The build derives all three strings it needs from this one:
#   Modrinth coordinates  mc26.3-0.9.2-fabric / mc26.3-0.9.2-neoforge
#   reported version      0.9.2+mc26.3   (what the loader says, and what
#                                          MesheliumSodiumVersion compares)
sodium_base_version=0.9.2

# What this version's launch profile (Mojang's 26.3.json, arguments.jvm)
# passes as -XX:StackShadowPages. MesheliumLaunchCheck warns when the JVM
# runs with less; 0 would switch the check off. 26.3 is the first profile
# that passes it (MultiMC 0.7 and older Prism metadata dropped it, and the
# game died silently without it - docs/TROUBLESHOOTING.md).
launch_shadow_pages=32
